<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>锻造特殊矿石占比计算器</title>
<style>
    :root{
        --red: #e53935;
        --blue: #1e88e5;
        --yellow: #fff59d;
        --green: #43a047;
        --bg: #ffffff;
        --card-shadow: 0 6px 18px rgba(0,0,0,0.07);
        --radius: 12px;
        --font: "Noto Sans", "Microsoft Yahei", Arial, sans-serif;
    }
    html,body{
        height:100%;
        margin:0;
        background:var(--bg);
        font-family:var(--font);
        -webkit-font-smoothing:antialiased;
        -moz-osx-font-smoothing:grayscale;
    }
    .container{
        max-width:420px;
        margin:28px auto;
        padding:18px;
    }

    /* 顶部红色提示栏 (原来画中的红色20格子) */
    .top-note{
        background:var(--red);
        color:#fff;
        border-radius:12px;
        padding:16px;
        font-weight:600;
        box-shadow:var(--card-shadow);
        text-align:center;
        margin-bottom:18px;
        line-height:1.4;
        font-size:15px;
    }

    /* 四个输入格子区 */
    .inputs{
        display:flex;
        gap:10px;
        justify-content:space-between;
        margin-bottom:14px;
    }
    .input-wrap{
        flex:1;
        text-align:center;
    }
    .label-index{
        font-size:14px;
        color:var(--blue);
        margin-bottom:6px;
        font-weight:700;
    }
    input[type="number"]{
        width:100%;
        box-sizing:border-box;
        padding:10px 8px;
        border-radius:10px;
        border:2px solid rgba(30,136,229,0.18);
        outline:none;
        font-size:16px;
        text-align:center;
        box-shadow:0 4px 10px rgba(30,136,229,0.04);
    }
    input[type="number"]:focus{
        border-color:var(--blue);
        box-shadow:0 8px 20px rgba(30,136,229,0.08);
    }
    .hint{
        font-size:12px;
        color:#666;
        margin-top:8px;
        text-align:left;
    }

    /* 总数 黄色卡片 */
    .total-card{
        background:var(--yellow);
        border-radius:10px;
        padding:10px 12px;
        margin-top:12px;
        box-shadow:var(--card-shadow);
        display:flex;
        justify-content:space-between;
        align-items:center;
        font-weight:700;
        color:#222;
    }

    /* 百分比显示 区 (黄色长条) */
    .percent-bar{
        margin-top:12px;
        background:var(--yellow);
        border-radius:10px;
        padding:14px;
        box-shadow:var(--card-shadow);
        font-weight:700;
        text-align:center;
        font-size:16px;
    }

    /* 绿色计算按钮 */
    .btn-calc{
        display:block;
        width:100%;
        margin-top:14px;
        padding:12px 16px;
        border-radius:10px;
        border:none;
        background:var(--green);
        color:#fff;
        font-weight:800;
        font-size:16px;
        cursor:pointer;
        box-shadow:0 8px 18px rgba(67,160,71,0.18);
    }
    .btn-calc:active{ transform:translateY(1px); }

    /* 错误提示 */
    .error{
        margin-top:10px;
        color:#c62828;
        font-weight:700;
        font-size:13px;
    }

    /* 底部的红色圆形和名字 (红色10) */
    .bottom-row{
        display:flex;
        align-items:center;
        gap:12px;
        margin-top:34px;
    }
    .red-circle{
        width:56px;
        height:56px;
        border-radius:50%;
        background:var(--red);
        display:flex;
        align-items:center;
        justify-content:center;
        box-shadow:var(--card-shadow);
        flex-shrink:0;
        overflow:hidden;
    }
    .red-circle img{
        width:100%;
        height:100%;
        object-fit:cover;
        display:block;
    }
    .creator{
        flex:1;
    }
    .creator .name-line{
        display:flex;
        align-items:center;
        gap:12px;
    }
    .creator .pmpl{
        font-weight:800;
        color:#222;
    }
    .creator .line{
        height:2px;
        background:#ddd;
        flex:1;
        border-radius:2px;
    }

    /* 小屏适配 */
    @media (max-width:420px){
        .inputs{ gap:8px; }
    }
</style>
</head>
<body>
<div class="container">
    <!-- 顶部红色提示 -->
    <div class="top-note">
        该网页用于计算 Roblox 锻造者里的锻造特殊矿石占比%。
    </div>

    <!-- 四个输入格 -->
    <div class="inputs" id="inputsArea">
        <div class="input-wrap">
            <div class="label-index">1</div>
            <input type="number" id="v1" min="1" max="100" placeholder="1 - 100" />
        </div>
        <div class="input-wrap">
            <div class="label-index">2</div>
            <input type="number" id="v2" min="1" max="100" placeholder="1 - 100" />
        </div>
        <div class="input-wrap">
            <div class="label-index">3</div>
            <input type="number" id="v3" min="1" max="100" placeholder="1 - 100" />
        </div>
        <div class="input-wrap">
            <div class="label-index">4</div>
            <input type="number" id="v4" min="1" max="100" placeholder="1 - 100" />
        </div>
    </div>

    <div class="hint">提示：每格输入数值为 1 ~ 100，至少填写任意 2 格才可计算，空格会被忽略。</div>

    <!-- 总数 -->
    <div class="total-card" id="totalCard">
        <div>总数：</div>
        <div id="totalValue">—</div>
    </div>

    <!-- 百分比显示 -->
    <div class="percent-bar" id="percentBar">— % - — %</div>

    <!-- 计算按钮 -->
    <button class="btn-calc" id="calcBtn">计算</button>

    <!-- 错误提示 -->
    <div class="error" id="errorMsg" style="display:none"></div>

    <!-- 底部 圆形红色10 放 noFilter.webp，旁边显示 pmpl893 -->
    <div class="bottom-row">
        <div class="red-circle" title="红色 10 的圆形格子 - 请把 noFilter.webp 放在同一资料夹">
            <!-- 请把 noFilter.webp 放在同一目录 -->
            <img id="creatorImg" src="noFilter.webp" alt="noFilter" onerror="this.style.background='#fff'; this.alt='请添加 noFilter.webp';" />
        </div>
        <div class="creator">
            <div class="name-line">
                <div class="pmpl">pmpl893</div>
                <div class="line"></div>
            </div>
        </div>
    </div>
</div>

<script>
(function(){
    const getVal = id => {
        const el = document.getElementById(id);
        const v = el.value.trim();
        if (v === "") return null;
        // allow decimals? user's inputs likely integers but spec didn't forbid; we'll accept integers only.
        const n = Number(v);
        if (!Number.isFinite(n)) return null;
        return n;
    };

    const calcBtn = document.getElementById("calcBtn");
    const errorMsg = document.getElementById("errorMsg");
    const totalValueEl = document.getElementById("totalValue");
    const percentBar = document.getElementById("percentBar");

    function showError(msg){
        errorMsg.style.display = "block";
        errorMsg.textContent = msg;
    }
    function clearError(){
        errorMsg.style.display = "none";
        errorMsg.textContent = "";
    }

    function validateAndCompute(){
        clearError();
        const keys = ["v1","v2","v3","v4"];
        const raw = keys.map(getVal);

        // filter out nulls and enforce min/max
        const filled = [];
        raw.forEach((val, idx) => {
            if (val === null) return;
            if (!Number.isFinite(val)){
                showError("请输入有效数字。");
                throw "validation";
            }
            if (val < 1 || val > 100){
                showError("第 " + (idx+1) + " 个输入超出范围 (1-100)。");
                throw "validation";
            }
            // Round to integer (因为界面手写的可能都是整数)
            const n = Math.round(val);
            filled.push({ index: idx+1, value: n });
        });

        if (filled.length < 2){
            showError("最少需要填写两个输入格才能计算。");
            throw "validation";
        }

        // compute total (sum of filled)
        const total = filled.reduce((s, it) => s + it.value, 0);
        if (total === 0){
            showError("总数为 0，无法计算占比。");
            throw "validation";
        }

        // compute percents in the order of their original indexes (1..4)
        // Only include those filled
        const percents = filled.map(it => {
            const p = (it.value / total) * 100;
            return {
                index: it.index,
                value: it.value,
                percent: Number(p.toFixed(2))
            };
        });

        // display total and percentage string
        totalValueEl.textContent = total;

        // generate percent string in order (by index)
        percents.sort((a,b) => a.index - b.index);
        const percentStr = percents.map(p => p.percent.toFixed(2) + "%").join(" - ");
        percentBar.textContent = percentStr;

        // also visually return the data (no popups)
        return { total, percents };
    }

    calcBtn.addEventListener("click", function(){
        try{
            validateAndCompute();
        }catch(e){
            // validation thrown - do nothing else
        }
    });

    // optional: recalc when pressing Enter in any input
    const inputs = ["v1","v2","v3","v4"].map(id => document.getElementById(id));
    inputs.forEach(inp => {
        inp.addEventListener("keydown", function(e){
            if (e.key === "Enter"){
                calcBtn.click();
                e.preventDefault();
            }
        });
    });

    // init: clear fields and show placeholders
    totalValueEl.textContent = "—";
    percentBar.textContent = "— % - — %";
})();
</script>
</body>
  </html>
